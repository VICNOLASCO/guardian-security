<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardian · Acceso</title>
    <!-- ✅ FAVICON -->
    <link rel="icon" type="image/png" href="/static/logo_shield.png">
    <!-- ✅ TOASTIFY -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0A0F1A; overflow-y: auto; overflow-x: hidden; position: relative; }
        .bg-image { position: fixed; top: -5%; left: -5%; width: 110%; height: 110%; z-index: 0; background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1920&q=80'); background-size: cover; background-position: center; filter: brightness(0.6) saturate(1.2) blur(4px); animation: slowZoom 25s ease-in-out infinite alternate; }
        @keyframes slowZoom { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: radial-gradient(circle at center, rgba(0, 15, 30, 0.3) 0%, rgba(0, 0, 0, 0.85) 100%); }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; width: 4px; height: 4px; background: rgba(0, 180, 255, 0.4); border-radius: 50%; box-shadow: 0 0 10px rgba(0, 180, 255, 0.3); animation: float-particle 25s infinite linear; }
        .particle:nth-child(1) { left: 5%; animation-duration: 20s; } .particle:nth-child(2) { left: 15%; animation-duration: 24s; animation-delay: 2s; } .particle:nth-child(3) { left: 25%; animation-duration: 18s; animation-delay: 4s; } .particle:nth-child(4) { left: 35%; animation-duration: 26s; animation-delay: 1s; } .particle:nth-child(5) { left: 45%; animation-duration: 22s; animation-delay: 3s; } .particle:nth-child(6) { left: 55%; animation-duration: 19s; animation-delay: 5s; } .particle:nth-child(7) { left: 65%; animation-duration: 23s; animation-delay: 2s; } .particle:nth-child(8) { left: 75%; animation-duration: 21s; animation-delay: 4s; } .particle:nth-child(9) { left: 85%; animation-duration: 25s; animation-delay: 0s; } .particle:nth-child(10) { left: 95%; animation-duration: 18s; animation-delay: 3s; }
        @keyframes float-particle { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }
        .login-wrapper { position: relative; z-index: 2; display: flex; max-width: 1200px; width: 100%; background: rgba(5, 12, 24, 0.6); backdrop-filter: blur(16px); border-radius: 40px; overflow: hidden; border: 1px solid rgba(0, 180, 255, 0.15); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(0, 180, 255, 0.1); animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1); margin: 20px 0; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .info-panel { flex: 1.2; padding: 40px; background: rgba(0, 0, 0, 0.2); display: flex; flex-direction: column; justify-content: center; border-right: 1px solid rgba(0, 180, 255, 0.05); }
        .shield { width: 340px; height: 340px; margin: 0 auto 20px auto; display: block; object-fit: contain; filter: drop-shadow(0 0 80px rgba(255, 215, 0, 0.8)); animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        .info-panel h1 { font-family: 'Orbitron', sans-serif; font-size: 3.2rem; font-weight: 800; letter-spacing: 6px; background: linear-gradient(135deg, #FFFFFF, #00B4FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .info-panel .subtitle { font-size: 1.2rem; color: rgba(255, 255, 255, 0.85); margin-bottom: 4px; }
        .info-panel .slogan { font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); font-style: italic; border-left: 3px solid #00B4FF; padding-left: 16px; line-height: 1.6; }
        .form-panel { flex: 1; padding: 60px 50px; background: rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; justify-content: center; }
        .form-panel h2 { font-family: 'Montserrat', sans-serif; font-size: 1.8rem; font-weight: 800; color: #FFFFFF; margin-bottom: 4px; }
        .form-panel .form-sub { font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.7rem; color: rgba(255, 255, 255, 0.7); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; font-weight: 600; }
        .input-group input { width: 100%; padding: 16px 20px; background: rgba(0, 10, 25, 0.8); border: 2px solid rgba(0, 180, 255, 0.15); border-radius: 14px; font-size: 1rem; color: #E0F0FF; transition: all 0.3s ease; outline: none; font-family: inherit; font-weight: 600; }
        .input-group input:focus { border-color: #00B4FF; background: rgba(0, 20, 45, 0.9); box-shadow: 0 0 30px rgba(0, 180, 255, 0.15); }
        .btn-login { width: 100%; padding: 18px; background: linear-gradient(135deg, #0033FF, #00D4FF); border: none; border-radius: 14px; font-size: 1.1rem; font-weight: 800; color: #FFFFFF; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px; margin-top: 6px; box-shadow: 0 8px 25px rgba(0, 100, 255, 0.4); }
        .btn-login:hover { transform: scale(1.02); box-shadow: 0 0 60px rgba(0, 150, 255, 0.5); }
        .form-footer { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .security-badge { display: flex; align-items: center; gap: 8px; font-size: 0.6rem; color: rgba(255, 255, 255, 0.5); font-weight: 600; }
        .security-badge .dot { width: 6px; height: 6px; background: #4CAF50; border-radius: 50%; animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }
        .register-link { font-size: 0.7rem; color: rgba(255, 255, 255, 0.5); cursor: pointer; background: none; border: none; font-family: inherit; font-weight: 600; }
        .register-link:hover { color: #88CCFF; }
        .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .chip { background: rgba(0, 40, 70, 0.5); padding: 6px 16px; border-radius: 40px; font-size: 0.55rem; color: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0, 180, 255, 0.1); text-transform: uppercase; font-weight: 600; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: linear-gradient(145deg, rgba(5, 12, 24, 0.98), rgba(10, 22, 40, 0.95)); border-radius: 28px; padding: 2.5rem; max-width: 420px; width: 90%; border: 1px solid rgba(0, 180, 255, 0.15); box-shadow: 0 30px 80px rgba(0,0,0,0.8); }
        .modal-content h3 { color: #00B4FF; font-size: 1.4rem; text-align: center; margin-bottom: 4px; font-weight: 700; }
        .modal-content p { color: rgba(255, 255, 255, 0.4); font-size: 0.75rem; text-align: center; margin-bottom: 1.8rem; }
        .modal-content input { width: 100%; padding: 14px 18px; margin: 8px 0; background: rgba(0, 10, 25, 0.8); border: 2px solid rgba(0, 180, 255, 0.15); border-radius: 12px; color: #E0F0FF; font-size: 0.95rem; font-family: inherit; outline: none; }
        .modal-content input:focus { border-color: #00B4FF; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 1.8rem; }
        .modal-buttons button { flex: 1; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.85rem; border: none; }
        .btn-modal-register { background: linear-gradient(135deg, #0033FF, #00D4FF); color: white; }
        .btn-modal-cancel { background: transparent; border: 1px solid rgba(255, 68, 102, 0.25); color: #FF4466; }
        @media (max-width: 992px) { .login-wrapper { flex-direction: column; max-width: 500px; border-radius: 32px; } .info-panel { padding: 40px 25px; text-align: center; border-right: none; border-bottom: 1px solid rgba(0, 180, 255, 0.05); } .info-panel .slogan { border-left: none; padding-left: 0; } .form-panel { padding: 30px 25px; } .form-footer { flex-direction: column; text-align: center; } .chips-row { justify-content: center; } }
        @media (max-width: 480px) { .info-panel h1 { font-size: 2.2rem; } .shield { width: 180px; height: 180px; } .login-wrapper { border-radius: 24px; } .info-panel, .form-panel { padding: 20px 16px; } }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>
    <div class="particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>

    <div class="login-wrapper">
        <div class="info-panel">
            <img src="/static/logo_shield.png" class="shield" alt="Guardian Logo" />
            <h1>GUARDIAN</h1>
            <div class="subtitle">Protección avanzada para tu ecosistema digital.</div>
            <div class="slogan">"No estás solo. Tu información tiene un Guardián."</div>
        </div>
        <div class="form-panel">
            <h2>Acceso al Sistema</h2>
            <div class="form-sub">Ingresa tus credenciales de seguridad</div>
            <form id="loginForm">
                <div class="input-group">
                    <label>📧 Correo electrónico</label>
                    <input type="email" id="email" placeholder="admin@guardian.com" required>
                </div>
                <div class="input-group">
                    <label>🔒 Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Acceder al sistema</button>
            </form>
            <div class="form-footer">
                <div class="security-badge"><span class="dot"></span>Conexión Segura · TLS 1.3</div>
                <button class="register-link" onclick="abrirModalRegistro()">📝 ¿No tienes cuenta? Regístrate</button>
            </div>
            <div class="chips-row">
                <span class="chip">Protección</span><span class="chip">Integridad</span><span class="chip">Confidencialidad</span><span class="chip">Monitoreo</span>
            </div>
        </div>
    </div>

    <div id="modalRegistro" class="modal">
        <div class="modal-content">
            <h3>📝 Crear Cuenta</h3><p>Regístrate para proteger tu información</p>
            <input type="text" id="regNombre" placeholder="Nombre completo">
            <input type="email" id="regEmail" placeholder="Correo electrónico">
            <input type="password" id="regPassword" placeholder="Contraseña">
            <input type="password" id="regConfirmPassword" placeholder="Confirmar contraseña">
            <div class="modal-buttons">
                <button class="btn-modal-register" onclick="registrarUsuario()">Registrarse</button>
                <button class="btn-modal-cancel" onclick="cerrarModal('modalRegistro')">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';

        // ✅ FUNCIÓN PARA NOTIFICACIONES ELEGANTES
        function showToast(message, type = 'info') {
            const colors = { success: 'linear-gradient(to right, #00b09b, #96c93d)', error: 'linear-gradient(to right, #ff416c, #ff4b2b)', info: 'linear-gradient(to right, #2193b0, #6dd5ed)' };
            Toastify({ text: message, duration: 3500, close: true, gravity: "top", position: "right", style: { background: colors[type] || colors.info, fontFamily: 'Inter, sans-serif', borderRadius: '10px', boxShadow: '0 10px 30px rgba(0,0,0,0.4)' } }).showToast();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            showToast('🔄 Conectando...', 'info');

            try {
                const response = await fetch(`${API_URL}/auth/login`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ email, password }) 
                });
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('user_email', email);
                    localStorage.setItem('user_rol', data.usuario.rol || 'user');
                    localStorage.setItem('token', data.token);
                    showToast('✅ Bienvenido a Guardian', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    showToast('❌ ' + (data.message || 'Credenciales incorrectas'), 'error');
                }
            } catch (error) { 
                showToast('❌ Error de conexión con el servidor', 'error'); 
            }
        });

        function abrirModalRegistro() { document.getElementById('modalRegistro').style.display = 'flex'; }
        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

        async function registrarUsuario() {
            const nombre = document.getElementById('regNombre').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!email || !password) { showToast('⚠️ Correo y contraseña requeridos', 'error'); return; }
            if (password !== confirmPassword) { showToast('⚠️ Las contraseñas no coinciden', 'error'); return; }
            if (password.length < 6) { showToast('⚠️ La contraseña debe tener al menos 6 caracteres', 'error'); return; }
            
            try {
                const response = await fetch(`${API_URL}/auth/registro`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ email, password, nombre: nombre || email.split('@')[0] }) 
                });
                const data = await response.json();
                
                if (data.success) {
                    showToast('✅ Registrado exitosamente', 'success');
                    setTimeout(() => {
                        cerrarModal('modalRegistro');
                        document.getElementById('email').value = email;
                        document.getElementById('password').value = '';
                    }, 1500);
                } else { 
                    showToast('❌ ' + (data.message || 'Error al registrar'), 'error'); 
                }
            } catch (error) { 
                showToast('❌ Error de conexión', 'error'); 
            }
        }
    </script>
</body>
</html>
